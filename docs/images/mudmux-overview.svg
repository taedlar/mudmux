<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">mudmux high-level architecture</title>
  <desc id="desc">Clients connect through transports to mudmux. mudmux runs asynchronous I/O and turns input into hooks for the MUD server, which sends output back through mudmux.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="6" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#52606d"/>
    </marker>
    <style>
      .label { font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #172b4d; }
      .small { font: 14px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #42526e; }
      .tiny { font: 12px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #52606d; }
      .group { font: 700 14px system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #0052cc; letter-spacing: .08em; }
      .wire { fill: none; stroke: #52606d; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="960" height="430" rx="20" fill="#f7f9fc"/>
  <text x="48" y="50" class="group">HIGH-LEVEL CONCEPTS</text>
  <text x="48" y="82" class="label" style="font-size:24px">Connects logic-layer to many kinds of clients</text>

  <!-- Clients -->
  <rect x="48" y="126" width="196" height="240" rx="14" fill="#fff" stroke="#b3bac5" stroke-width="2"/>
  <text x="72" y="158" class="label">Clients</text>
  <rect x="70" y="181" width="152" height="42" rx="8" fill="#e9f2ff"/>
  <text x="146" y="207" text-anchor="middle" class="small">Plain / TLS</text>
  <rect x="70" y="238" width="152" height="42" rx="8" fill="#e9f2ff"/>
  <text x="146" y="264" text-anchor="middle" class="small">WebSocket / TELNET</text>
  <rect x="70" y="295" width="152" height="42" rx="8" fill="#e9f2ff"/>
  <text x="146" y="321" text-anchor="middle" class="small">Console · pipe · UDS</text>

  <!-- mudmux -->
  <rect x="334" y="108" width="322" height="276" rx="16" fill="#deebff" stroke="#0052cc" stroke-width="3"/>
  <text x="362" y="146" class="label" style="font-size:22px;fill:#0052cc">mudmux (shared library)</text>
  <text x="362" y="171" class="tiny">All clients as communication "slots"</text>
  <rect x="362" y="195" width="266" height="52" rx="9" fill="#fff"/>
  <text x="495" y="218" text-anchor="middle" class="label">Async I/O &amp; transport protocols</text>
  <text x="495" y="237" text-anchor="middle" class="tiny">Raw · TLS · WebSocket · TELNET</text>
  <rect x="362" y="264" width="266" height="52" rx="9" fill="#fff"/>
  <text x="495" y="287" text-anchor="middle" class="label">Input mode &amp; virtual terminal</text>
  <text x="495" y="306" text-anchor="middle" class="tiny">line / char / structured-frame</text>
  <text x="495" y="355" text-anchor="middle" class="small">Unified event-loop + thread-pool</text>

  <!-- logic-layer -->
  <rect x="746" y="126" width="196" height="240" rx="14" fill="#fff" stroke="#36b37e" stroke-width="2"/>
  <text x="764" y="158" class="label">Logic layer</text>
  <rect x="764" y="186" width="160" height="60" rx="8" fill="#e3fcef"/>
  <text x="844" y="211" text-anchor="middle" class="label">Domain objects</text>
  <text x="844" y="230" text-anchor="middle" class="tiny">world · players · items</text>
  <rect x="764" y="270" width="160" height="62" rx="8" fill="#e3fcef"/>
  <text x="844" y="295" text-anchor="middle" class="label">Hook callbacks</text>
  <text x="844" y="314" text-anchor="middle" class="tiny">policies &amp; events</text>

  <!-- data flow -->
  <path d="M244 211 H334" class="wire"/>
  <text x="289" y="199" text-anchor="middle" class="tiny">bytes in</text>
  <path d="M656 211 H746" class="wire"/>
  <text x="701" y="199" text-anchor="middle" class="tiny">input hooks</text>
  <path d="M746 337 H656" class="wire"/>
  <text x="701" y="360" text-anchor="middle" class="tiny">buffered write</text>
  <path d="M334 337 H244" class="wire"/>
  <text x="289" y="360" text-anchor="middle" class="tiny">bytes out</text>
</svg>
